# This is the mods.toml file for ProyectDragonBlocks.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# URL opcional para el soporte o problemas
# issueTrackerURL="https://github.com/dat000/proyect-dragonblocks/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Proyect Dragon Blocks"
authors="${mod_authors}"
description='''
Un mod RPG modular de Dragon Ball para Minecraft 1.20.1, que incluye sistemas de ki, auras personalizadas y mecánicas inmersivas.
'''

# Dependencias obligatorias (Forge y Minecraft)
[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# GeckoLib: modelos y animaciones de las razas
[[dependencies.${mod_id}]]
modId="geckolib"
mandatory=true
versionRange="[4.4.4,)"
ordering="NONE"
side="BOTH"